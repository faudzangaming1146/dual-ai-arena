<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Chat & AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Highlight.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05070d;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Video Background Black Hole */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -100;
      object-fit: cover;
      filter: brightness(0.5) contrast(1.1);
    }

    /* Layer Overlay Gradasi Tematik */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(13, 19, 34, 0.2) 0%, rgba(5, 7, 13, 0.85) 100%);
      z-index: -99;
      pointer-events: none;
    }

    /* Navbar Header */
    header {
      background-color: rgba(13, 19, 34, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand i {
      font-size: 24px;
      color: #38bdf8;
      filter: drop-shadow(0 0 8px #0284c7);
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .account-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    .btn {
      background-color: rgba(23, 32, 51, 0.75);
      color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .btn-primary {
      background-color: #0284c7;
      border-color: #38bdf8;
    }

    .btn-primary:hover {
      background-color: #0369a1;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
    }

    .btn-danger {
      background-color: #dc2626;
      border-color: #f87171;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.4);
    }

    /* Page Layout With Sidebar */
    .page-wrapper {
      display: flex;
      flex: 1;
    }

    /* Left Sidebar */
    .sidebar {
      width: 110px;
      background-color: rgba(13, 19, 34, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 25px;
      gap: 25px;
      z-index: 5;
    }

    .sidebar-btn {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      transition: all 0.2s;
    }

    .sidebar-btn:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 0 6px #38bdf8);
    }

    .sidebar-btn i {
      font-size: 28px;
    }

    .sidebar-btn span {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .admin-btn {
      color: #f43f5e !important;
    }

    .admin-btn:hover {
      filter: drop-shadow(0 0 6px #f43f5e) !important;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .ai-card {
      background-color: rgba(13, 19, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 850px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .ai-card h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .prompt-container input {
      flex: 1;
      background-color: rgba(5, 7, 13, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .prompt-container input:focus {
      border-color: #38bdf8;
    }

    /* AI Response & Markdown Styling */
    .ai-response {
      background-color: rgba(5, 7, 13, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 16px;
      min-height: 140px;
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 14px;
      overflow-x: auto;
    }

    .ai-response h1, .ai-response h2, .ai-response h3 {
      color: #f8fafc;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .ai-response p {
      margin-bottom: 10px;
    }

    .ai-response ul, .ai-response ol {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .ai-response pre {
      position: relative;
      background-color: #030408;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .ai-response code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
    }

    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #172033;
      color: #94a3b8;
      border: 1px solid #3b4d6c;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-code-btn:hover {
      background: #2e3d5a;
      color: #ffffff;
    }

    /* Modal / Popups */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      backdrop-filter: blur(6px);
    }

    .modal-card {
      background-color: rgba(13, 19, 34, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .modal-card.admin-modal-card {
      width: 520px;
      max-height: 80vh;
      border-color: #f43f5e;
    }

    .modal-card h3 {
      font-size: 16px;
      color: #38bdf8;
    }

    .modal-card input {
      background-color: #05070d;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: white;
      padding: 10px;
      border-radius: 6px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .user-manage-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .user-manage-item {
      background-color: #05070d;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-info .uname {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }

    .user-info .ustatus {
      font-size: 11px;
      color: #22c55e;
    }

    .user-info .ustatus.banned {
      color: #ef4444;
    }

    .user-actions {
      display: flex;
      gap: 6px;
    }

    /* Floating Windows Chat */
    .chat-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 340px;
      height: 450px;
      background-color: rgba(13, 19, 34, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .chat-box.private { right: 375px; border-color: #a855f7; }
    .chat-box.direct { left: 130px; bottom: 20px; right: auto; border-color: #38bdf8; }
    .chat-box.inbox { left: 130px; bottom: 20px; right: auto; width: 280px; }

    .chat-header {
      background-color: rgba(5, 7, 13, 0.8);
      padding: 10px 14px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    }

    .chat-header h3 {
      font-size: 14px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
    }

    .chat-messages, .inbox-list {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inbox-item {
      background-color: rgba(23, 32, 51, 0.8);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      transition: background 0.2s;
    }

    .inbox-item:hover {
      background-color: #0284c7;
    }

    .user-msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      word-break: break-word;
      position: relative;
    }

    .user-msg.msg-me {
      align-self: flex-end;
      background-color: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .user-msg.msg-them {
      align-self: flex-start;
      background-color: rgba(23, 32, 51, 0.85);
      color: #f8fafc;
      border-bottom-left-radius: 2px;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .user-msg.msg-them strong {
      color: #38bdf8;
      display: block;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 12px;
      margin-left: 8px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .del-btn:hover {
      opacity: 1;
    }

    .chat-input-area {
      padding: 10px;
      background-color: rgba(5, 7, 13, 0.8);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      display: flex;
      gap: 6px;
    }

    .chat-input-area input {
      flex: 1;
      background-color: #0d1322;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .hidden { display: none !important; }

    /* Desain Responsif Mobile */
    @media (max-width: 768px) {
      header {
        padding: 8px 12px;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }

      .brand {
        justify-content: center;
      }

      .brand h1 {
        font-size: 15px;
      }

      .nav-buttons {
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .account-label {
        font-size: 10px;
        width: 100%;
        text-align: center;
      }

      .btn {
        padding: 5px 9px;
        font-size: 11px;
        border-radius: 6px;
      }

      .page-wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: space-around;
        padding: 8px 4px;
        border-right: none;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        gap: 0;
      }

      .sidebar-btn {
        gap: 3px;
      }

      .sidebar-btn i {
        font-size: 20px;
      }

      .sidebar-btn span {
        font-size: 9px;
      }

      main {
        padding: 12px 8px;
      }

      .ai-card {
        padding: 14px;
      }

      .prompt-container {
        flex-direction: column;
      }

      .prompt-container input {
        font-size: 12px;
      }

      .chat-box, 
      .chat-box.private, 
      .chat-box.direct, 
      .chat-box.inbox {
        left: 8px !important;
        right: 8px !important;
        bottom: 8px !important;
        width: auto !important;
        height: 70vh !important;
      }

      .modal-card, 
      .modal-card.admin-modal-card {
        width: 92% !important;
        padding: 14px;
      }
    }
  </style>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Background Video Lubang Hitam (Path folder public di GitHub) -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="public/Interstellar Space Live Wallpaper - Black Hole & Planet - 4K Ultra HD.mp4.mp4" type="video/mp4">
  </video>

  <!-- Layer Overlay Dark Sci-Fi -->
  <div class="bg-overlay"></div>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-comments"></i>
      <h1>Information Chat & AI</h1>
    </div>
    <div class="nav-buttons">
      <span class="account-label">NAMA AKUN:</span>
      <button class="btn" id="name-btn" onclick="changeName()">👤 Loading...</button>
      <button class="btn btn-primary" onclick="toggleChat()"><i class="fa-solid fa-globe"></i> Global Chat</button>
      <button class="btn" style="border-color: #a855f7;" onclick="togglePrivateChat()"><i class="fa-solid fa-lock"></i> Chat Pribadi</button>
    </div>
  </header>

  <div class="page-wrapper">
    <!-- Left Sidebar / Top Nav Mobile -->
    <aside class="sidebar">
      <button class="sidebar-btn" onclick="toggleInbox()">
        <i class="fa-solid fa-comments"></i>
        <span>PESAN</span>
      </button>

      <button class="sidebar-btn" onclick="openSearchAccountModal()">
        <i class="fa-solid fa-comment-dots"></i>
        <span>KIRIM PESAN</span>
      </button>

      <!-- TOMBOL ADMIN PANEL -->
      <button class="sidebar-btn admin-btn hidden" id="admin-menu-btn" onclick="openAdminPanelModal()">
        <i class="fa-solid fa-user-shield"></i>
        <span style="color: #f43f5e;">ADMIN PANEL</span>
      </button>
    </aside>

    <!-- Main Content Area -->
    <main>
      <div class="ai-card">
        <h2><i class="fa-solid fa-robot"></i> Asisten Information Chat & AI</h2>
        <div class="prompt-container">
          <input type="text" id="prompt-input" placeholder="Tanyakan sesuatu pada AI..." onkeydown="if(event.key==='Enter') sendAiPrompt()">
          <button class="btn btn-primary" onclick="sendAiPrompt()"><i class="fa-solid fa-paper-plane"></i> Kirim</button>
        </div>
        <div class="ai-response" id="ai-response-box">
          <p style="color: #64748b;"><em>Hasil jawaban AI akan ditampilkan di sini...</em></p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Cari Akun -->
  <div class="modal-overlay hidden" id="search-modal">
    <div class="modal-card">
      <h3><i class="fa-solid fa-user-check"></i> Cari Akun Tujuan</h3>
      <input type="text" id="target-username-input" placeholder="Masukkan nama akun..." onkeydown="if(event.key==='Enter') verifyAndStartChat()">
      <div class="modal-actions">
        <button class="btn" onclick="closeSearchAccountModal()">Batal</button>
        <button class="btn btn-primary" onclick="verifyAndStartChat()">Cari & Chat</button>
      </div>
    </div>
  </div>

  <!-- Modal Admin Panel -->
  <div class="modal-overlay hidden" id="admin-panel-modal">
    <div class="modal-card admin-modal-card">
      <h3 style="color: #f43f5e;"><i class="fa-solid fa-user-gear"></i> Kelola Pengguna (Admin Panel)</h3>
      <div class="user-manage-list" id="admin-user-list">
        <p style="color: #64748b; font-size: 12px; text-align: center;">Memuat daftar pengguna...</p>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeAdminPanelModal()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Box Inbox -->
  <div class="chat-box inbox hidden" id="inbox-box">
    <div class="chat-header">
      <h3><i class="fa-solid fa-inbox"></i> Daftar Pesan</h3>
      <button class="close-btn" onclick="toggleInbox()">✕</button>
    </div>
    <div class="inbox-list" id="inbox-list">
      <p style="color: #64748b; font-size: 12px; text-align: center;">Belum ada riwayat pesan.</p>
    </div>
  </div>

  <!-- Box Direct Message -->
  <div class="chat-box direct hidden" id="direct-chat-box">
    <div class="chat-header">
      <h3 id="direct-chat-title"><i class="fa-solid fa-user"></i> Chat</h3>
      <button class="close-btn" onclick="closeDirectChat()">✕</button>
    </div>
    <div class="chat-messages" id="direct-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="direct-chat-input" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendDirectMessage()">
      <button class="btn btn-primary" onclick="sendDirectMessage()">Kirim</button>
    </div>
  </div>

  <!-- Global Chat Box -->
  <div class="chat-box hidden" id="global-chat-box">
    <div class="chat-header">
      <h3><i class="fa-solid fa-globe"></i> Global Chat</h3>
      <button class="close-btn" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area" id="global-input-area">
      <input type="text" id="chat-input" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button class="btn btn-primary" onclick="sendChatMessage()">Kirim</button>
    </div>
  </div>

  <!-- Private Chat Box -->
  <div class="chat-box private hidden" id="private-chat-box">
    <div class="chat-header" style="background: #2e1065;">
      <h3 style="color: #c084fc;"><i class="fa-solid fa-user-lock"></i> Chat Pribadi</h3>
      <button class="close-btn" onclick="togglePrivateChat()">✕</button>
    </div>
    <div class="chat-messages" id="private-chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="private-chat-input" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendPrivateChatMessage()">
      <button class="btn" style="background:#a855f7; border:none;" onclick="sendPrivateChatMessage()">Kirim</button>
    </div>
  </div>

  <!-- Markdown & Highlight CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6OStWOzG9HfLVP1d0hSROPThIw4SjZ1g",
      databaseURL: "https://dual-ai-arena-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const USER_SUFFIX = "@user.dualai.user";
    let deviceSecretKey = null;

    auth.signInAnonymously().then((userCredential) => {
      deviceSecretKey = userCredential.user.uid;
      checkBannedStatus();
    }).catch((error) => {
      console.error("Autentikasi Firebase Gagal:", error);
    });

    const allowedGlobalAdmins = [
      "dualaiarena.vercel.app",
      "@dualaiarena.",
      "*DUALAIARENA*",
      "dualaiarena.."
    ];

    function isGlobalAdmin(name) {
      return allowedGlobalAdmins.includes(name);
    }

    let userId = localStorage.getItem('chatUsername') || ("User_" + Math.floor(1000 + Math.random() * 9000));
    let nameClickCount = parseInt(localStorage.getItem('nameClickCount') || '0');
    let activeDirectTarget = null;
    let directListenerRef = null;

    document.addEventListener('DOMContentLoaded', () => {
      updateNameButtons();
      listenToInbox();
      checkGlobalChatPermission();
    });

    function updateNameButtons() {
      const nameBtn = document.getElementById('name-btn');
      if (nameBtn) nameBtn.innerText = userId;
    }

    function checkGlobalChatPermission() {
      const input = document.getElementById('chat-input');
      const adminBtn = document.getElementById('admin-menu-btn');

      if (!isGlobalAdmin(userId)) {
        if (input) {
          input.placeholder = "Hanya akun khusus yang bisa kirim pesan...";
          input.disabled = true;
        }
        if (adminBtn) adminBtn.classList.add('hidden');
      } else {
        if (input) {
          input.placeholder = "Ketik pesan...";
          input.disabled = false;
        }
        if (adminBtn) adminBtn.classList.remove('hidden');
      }
    }

    async function checkBannedStatus() {
      const sanitizedKey = userId.toLowerCase().replace(/[.#$/[\]]/g, "_");
      const snapshot = await db.ref('banned_users/' + sanitizedKey).once('value');
      if (snapshot.exists() && snapshot.val() === true) {
        alert("⚠️ Akun Anda telah DIBANNED oleh Admin. Anda tidak dapat mengirim pesan.");
      }
    }

    async function changeName() {
      const isNameChanged = localStorage.getItem('isNameChanged') === 'true';

      if (isNameChanged) {
        nameClickCount++;
        localStorage.setItem('nameClickCount', nameClickCount);

        if (nameClickCount >= 5) {
          const wantContactAdmin = confirm("⚠️ Anda sudah mengganti nama 1 kali dan akun ini telah dikunci permanen.\n\nApakah Anda ingin meminta izin kepada Admin untuk mengganti nama?");
          if (wantContactAdmin) {
            const adminWA = "6282315227030";
            const textMsg = encodeURIComponent(`Halo Admin, akun saya "${userId}" ingin meminta izin untuk mengganti nama akun.`);
            window.open(`https://wa.me/${adminWA}?text=${textMsg}`, '_blank');
          }
        } else {
          const sisaKlik = 5 - nameClickCount;
          alert(`⚠️ Nama akun kamu sudah permanen dan tidak bisa diganti lagi!\n(Klik ${sisaKlik}x lagi untuk opsi menghubungi Admin via WA)`);
        }
        return;
      }

      const currentBaseName = userId.replace(USER_SUFFIX, "");
      const inputName = prompt("Masukkan nama baru kamu (HANYA BISA DIGANTI 1 KALI & PERMANEN):", currentBaseName);
      if (!inputName || inputName.trim() === "") return;

      let baseName = inputName.trim();
      if (baseName.endsWith(USER_SUFFIX)) {
        baseName = baseName.substring(0, baseName.length - USER_SUFFIX.length);
      }

      const fullUsername = baseName + USER_SUFFIX;
      const sanitizedKey = fullUsername.toLowerCase().replace(/[.#$/[\]]/g, "_");

      try {
        const snapshot = await db.ref('claimed_names/' + sanitizedKey).once('value');
        const existingOwnerKey = snapshot.val();

        if (existingOwnerKey && existingOwnerKey !== deviceSecretKey) {
          alert(`⚠️ Nama "${baseName}" sudah digunakan pengguna lain! Cari nama lain.`);
          return;
        }

        await db.ref('claimed_names/' + sanitizedKey).set(deviceSecretKey);

        const oldSanitizedKey = userId.toLowerCase().replace(/[.#$/[\]]/g, "_");
        if (oldSanitizedKey !== sanitizedKey && !userId.startsWith("User_")) {
          db.ref('claimed_names/' + oldSanitizedKey).remove();
        }

        userId = fullUsername;
        localStorage.setItem('chatUsername', userId);
        localStorage.setItem('isNameChanged', 'true');
        
        updateNameButtons();
        listenToInbox();
        checkGlobalChatPermission();
        
        alert(`✅ Nama berhasil disimpan permanen sebagai: ${userId}`);
      } catch (err) {
        alert("Gagal memeriksa ketersediaan nama: " + err.message);
      }
    }

    function openSearchAccountModal() {
      document.getElementById('search-modal').classList.remove('hidden');
      document.getElementById('target-username-input').focus();
    }

    function closeSearchAccountModal() {
      document.getElementById('search-modal').classList.add('hidden');
      document.getElementById('target-username-input').value = '';
    }

    async function verifyAndStartChat() {
      let targetInput = document.getElementById('target-username-input').value.trim();
      if (!targetInput) return;

      if (!targetInput.endsWith(USER_SUFFIX) && !isGlobalAdmin(targetInput)) {
        targetInput = targetInput + USER_SUFFIX;
      }

      if (targetInput.toLowerCase() === userId.toLowerCase()) {
        alert("Kamu tidak bisa mengirim pesan ke akun milikmu sendiri!");
        return;
      }

      const targetSanitized = targetInput.toLowerCase().replace(/[.#$/[\]]/g, "_");

      try {
        const snapshot = await db.ref('claimed_names/' + targetSanitized).once('value');
        if (snapshot.exists()) {
          closeSearchAccountModal();
          startDirectChat(targetInput);
        } else {
          const baseSearchName = targetInput.replace(USER_SUFFIX, "");
          alert(`⚠️ Akun dengan nama "${baseSearchName}" tidak ditemukan dalam sistem!`);
        }
      } catch (err) {
        alert("Eror saat mencari akun: " + err.message);
      }
    }

    function openAdminPanelModal() {
      if (!isGlobalAdmin(userId)) return;
      document.getElementById('admin-panel-modal').classList.remove('hidden');
      loadAllRegisteredUsers();
    }

    function closeAdminPanelModal() {
      document.getElementById('admin-panel-modal').classList.add('hidden');
    }

    async function loadAllRegisteredUsers() {
      const container = document.getElementById('admin-user-list');
      container.innerHTML = '<p style="color: #64748b; font-size: 12px; text-align: center;"><i class="fa-solid fa-spinner fa-spin"></i> Memuat daftar pengguna...</p>';

      try {
        const namesSnap = await db.ref('claimed_names').once('value');
        const bannedSnap = await db.ref('banned_users').once('value');

        const claimedNames = namesSnap.val() || {};
        const bannedUsers = bannedSnap.val() || {};

        container.innerHTML = '';

        const keys = Object.keys(claimedNames);
        if (keys.length === 0) {
          container.innerHTML = '<p style="color: #64748b; font-size: 12px; text-align: center;">Belum ada akun terdaftar.</p>';
          return;
        }

        keys.forEach(sanitizedKey => {
          const isBanned = !!bannedUsers[sanitizedKey];
          const item = document.createElement('div');
          item.className = 'user-manage-item';
          
          item.innerHTML = `
            <div class="user-info">
              <span class="uname">${sanitizedKey}</span>
              <span class="ustatus ${isBanned ? 'banned' : ''}">${isBanned ? '🚫 Banned' : '🟢 Aktif'}</span>
            </div>
            <div class="user-actions">
              <button class="btn" onclick="adminEditUsername('${sanitizedKey}')"><i class="fa-solid fa-pen"></i> Ubah</button>
              <button class="btn ${isBanned ? 'btn-primary' : 'btn-danger'}" onclick="adminToggleBan('${sanitizedKey}', ${isBanned})">
                ${isBanned ? '<i class="fa-solid fa-unlock"></i> Unban' : '<i class="fa-solid fa-ban"></i> Ban'}
              </button>
            </div>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444; font-size: 12px;">Gagal memuat: ${err.message}</p>`;
      }
    }

    async function adminEditUsername(oldSanitizedKey) {
      if (!isGlobalAdmin(userId)) return;

      const newBaseName = prompt(`Ubah nama akun [${oldSanitizedKey}]:`);
      if (!newBaseName || !newBaseName.trim()) return;

      let formatted = newBaseName.trim();
      if (!formatted.endsWith(USER_SUFFIX) && !isGlobalAdmin(formatted)) {
        formatted += USER_SUFFIX;
      }

      const newSanitizedKey = formatted.toLowerCase().replace(/[.#$/[\]]/g, "_");

      try {
        const ownerUidSnap = await db.ref('claimed_names/' + oldSanitizedKey).once('value');
        const ownerUid = ownerUidSnap.val();

        await db.ref('claimed_names/' + newSanitizedKey).set(ownerUid || "ADMIN_MODIFIED");
        await db.ref('claimed_names/' + oldSanitizedKey).remove();

        const bannedSnap = await db.ref('banned_users/' + oldSanitizedKey).once('value');
        if (bannedSnap.exists()) {
          await db.ref('banned_users/' + newSanitizedKey).set(bannedSnap.val());
          await db.ref('banned_users/' + oldSanitizedKey).remove();
        }

        alert(`✅ Nama akun berhasil diubah menjadi: ${formatted}`);
        loadAllRegisteredUsers();
      } catch (err) {
        alert("Gagal mengubah nama: " + err.message);
      }
    }

    async function adminToggleBan(sanitizedKey, isCurrentlyBanned) {
      if (!isGlobalAdmin(userId)) return;

      const actionText = isCurrentlyBanned ? "Membuka Banned (Unban)" : "Mem-Banned";
      if (!confirm(`Apakah Anda yakin ingin ${actionText} akun [${sanitizedKey}]?`)) return;

      try {
        if (isCurrentlyBanned) {
          await db.ref('banned_users/' + sanitizedKey).remove();
        } else {
          await db.ref('banned_users/' + sanitizedKey).set(true);
        }
        loadAllRegisteredUsers();
      } catch (err) {
        alert("Gagal mengubah status Banned: " + err.message);
      }
    }

    function getRoomKey(userA, userB) {
      const sorted = [userA.toLowerCase(), userB.toLowerCase()].sort();
      return sorted[0].replace(/[.#$/[\]]/g, "_") + "_ROOM_" + sorted[1].replace(/[.#$/[\]]/g, "_");
    }

    function startDirectChat(targetUser) {
      activeDirectTarget = targetUser;
      document.getElementById('direct-chat-title').innerHTML = `<i class="fa-solid fa-user"></i> ${targetUser}`;
      document.getElementById('direct-messages').innerHTML = '';
      document.getElementById('direct-chat-box').classList.remove('hidden');

      if (directListenerRef) directListenerRef.off();

      const roomKey = getRoomKey(userId, targetUser);
      directListenerRef = db.ref('direct_chats/' + roomKey).limitToLast(50);
      
      directListenerRef.on('child_added', (snapshot) => {
        const data = snapshot.val();
        appendChatMessage('direct-messages', data.sender, data.text, snapshot.key, false);
      });
    }

    function closeDirectChat() {
      document.getElementById('direct-chat-box').classList.add('hidden');
      if (directListenerRef) directListenerRef.off();
      activeDirectTarget = null;
    }

    async function sendDirectMessage() {
      const mySanitized = userId.toLowerCase().replace(/[.#$/[\]]/g, "_");
      const bannedSnap = await db.ref('banned_users/' + mySanitized).once('value');
      if (bannedSnap.exists() && bannedSnap.val() === true) {
        alert("⚠️ Akun Anda dilarang (Banned) mengirim pesan!");
        return;
      }

      const input = document.getElementById('direct-chat-input');
      const text = input.value.trim();
      if (!text || !activeDirectTarget) return;

      const roomKey = getRoomKey(userId, activeDirectTarget);
      
      db.ref('direct_chats/' + roomKey).push({
        sender: userId,
        text: text,
        timestamp: Date.now()
      });

      const targetSanitized = activeDirectTarget.toLowerCase().replace(/[.#$/[\]]/g, "_");

      db.ref(`user_inboxes/${mySanitized}/${targetSanitized}`).set({ targetName: activeDirectTarget });
      db.ref(`user_inboxes/${targetSanitized}/${mySanitized}`).set({ targetName: userId });

      input.value = '';
    }

    function toggleInbox() {
      document.getElementById('inbox-box').classList.toggle('hidden');
    }

    function listenToInbox() {
      const mySanitized = userId.toLowerCase().replace(/[.#$/[\]]/g, "_");
      db.ref(`user_inboxes/${mySanitized}`).on('value', (snapshot) => {
        const inboxList = document.getElementById('inbox-list');
        inboxList.innerHTML = '';

        if (!snapshot.exists()) {
          inboxList.innerHTML = '<p style="color: #64748b; font-size: 12px; text-align: center;">Belum ada riwayat pesan.</p>';
          return;
        }

        snapshot.forEach((child) => {
          const item = child.val();
          const div = document.createElement('div');
          div.className = 'inbox-item';
          div.innerHTML = `<i class="fa-solid fa-circle-user" style="color:#38bdf8;"></i> <strong>${item.targetName}</strong>`;
          div.onclick = () => {
            toggleInbox();
            startDirectChat(item.targetName);
          };
          inboxList.appendChild(div);
        });
      });
    }

    db.ref('global_chat').limitToLast(50).on('child_added', (snapshot) => {
      const data = snapshot.val();
      appendChatMessage('chat-messages', data.sender, data.text, snapshot.key, true);
    });

    db.ref('global_chat').on('child_removed', (snapshot) => {
      const el = document.getElementById('global-msg-' + snapshot.key);
      if (el) el.remove();
    });

    function toggleChat() {
      document.getElementById('global-chat-box').classList.toggle('hidden');
    }

    function sendChatMessage() {
      if (!isGlobalAdmin(userId)) {
        alert("⚠️ Hanya akun khusus (dualaiarena.vercel.app, @dualaiarena., *DUALAIARENA*, dualaiarena..) yang dapat mengirim pesan di Chat Global!");
        return;
      }

      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (text) {
        db.ref('global_chat').push({ sender: userId, text: text, timestamp: Date.now() });
        input.value = '';
      }
    }

    function deleteGlobalMessage(key) {
      if (!isGlobalAdmin(userId)) {
        alert("Akses ditolak. Anda tidak memiliki izin untuk menghapus pesan!");
        return;
      }
      if (confirm("Apakah Anda yakin ingin menghapus pesan ini dari Chat Global?")) {
        db.ref('global_chat/' + key).remove();
      }
    }

    let isPrivateUnlocked = false;
    db.ref('private_chat').limitToLast(50).on('child_added', (snapshot) => {
      const data = snapshot.val();
      appendChatMessage('private-chat-messages', data.sender, data.text, snapshot.key, false);
    });

    function togglePrivateChat() {
      const box = document.getElementById('private-chat-box');
      if (box.classList.contains('hidden')) {
        if (!isPrivateUnlocked) {
          const pass = prompt("Masukkan Sandi Chat Pribadi:");
          if (pass === "78900987") {
            isPrivateUnlocked = true;
            box.classList.remove('hidden');
          } else if (pass !== null) {
            alert("Sandi Salah!");
          }
        } else {
          box.classList.remove('hidden');
        }
      } else {
        box.classList.add('hidden');
      }
    }

    function sendPrivateChatMessage() {
      const input = document.getElementById('private-chat-input');
      const text = input.value.trim();
      if (text) {
        db.ref('private_chat').push({ sender: userId, text: text, timestamp: Date.now() });
        input.value = '';
      }
    }

    function appendChatMessage(containerId, sender, text, msgKey = '', isGlobal = false) {
      const container = document.getElementById(containerId);
      if (!container) return;
      
      const msgDiv = document.createElement('div');
      if (isGlobal && msgKey) {
        msgDiv.id = 'global-msg-' + msgKey;
      }

      const canDelete = isGlobal && isGlobalAdmin(userId);
      const deleteButtonHtml = canDelete ? `<button class="del-btn" onclick="deleteGlobalMessage('${msgKey}')" title="Hapus Pesan"><i class="fa-solid fa-trash"></i></button>` : '';
      
      if (sender === userId) {
        msgDiv.className = 'user-msg msg-me';
        msgDiv.innerHTML = `${text}${deleteButtonHtml}`;
      } else {
        msgDiv.className = 'user-msg msg-them';
        msgDiv.innerHTML = `<strong>${sender}</strong>${text}${deleteButtonHtml}`;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    async function sendAiPrompt() {
      const input = document.getElementById('prompt-input');
      const box = document.getElementById('ai-response-box');
      const prompt = input.value.trim();
      if (!prompt) return;

      box.innerHTML = '<p style="color: #38bdf8;"><i class="fa-solid fa-spinner fa-spin"></i> <em>Sedang memproses respons...</em></p>';
      
      try {
        const res = await fetch('/api/gemini', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt })
        });
        
        const data = await res.json();
        if (res.ok && data.reply) {
          renderAiMarkdown(data.reply);
          input.value = '';
        } else {
          box.innerHTML = '<span style="color: #ef4444;">Eror: ' + (data.error || 'Gagal terhubung ke AI.') + '</span>';
        }
      } catch (err) {
        box.innerHTML = '<span style="color: #ef4444;">Eror Jaringan: ' + err.message + '</span>';
      }
    }

    function renderAiMarkdown(text) {
      const box = document.getElementById('ai-response-box');

      marked.setOptions({
        highlight: function(code, lang) {
          const language = hljs.getLanguage(lang) ? lang : 'plaintext';
          return hljs.highlight(code, { language }).value;
        }
      });

      box.innerHTML = marked.parse(text);

      box.querySelectorAll('pre').forEach((pre) => {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
        copyBtn.onclick = () => {
          const codeText = pre.querySelector('code')?.innerText || pre.innerText;
          navigator.clipboard.writeText(codeText);
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
          setTimeout(() => (copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy'), 2000);
        };
        pre.appendChild(copyBtn);
      });
    }
  </script>
</body>
