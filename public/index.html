<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual AI Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121926; color: #fff; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; }
    #chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 12px; border-radius: 8px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
    .msg img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
    .user { background: #1e40af; align-self: flex-end; }
    .ai-chatgpt { background: #14532d; align-self: flex-start; }
    .ai-gemini { background: #1e3a8a; align-self: flex-start; }
    .controls { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
    textarea { width: 100%; height: 60px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 10px; resize: none; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
    .btn-img { background: #0284c7; }
    .btn-gpt { background: #16a34a; }
    .btn-game { background: #eab308; color: #000; }
    .btn-gemini { background: #2563eb; }
    .btn-both { background: #9333ea; }
    .btn-clear { background: #dc2626; }
    #preview-container { display: none; align-items: center; gap: 10px; background: #1e293b; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
    #preview-img { height: 40px; border-radius: 4px; }
    
    #game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    #game-modal.active { display: flex; }
    #game-frame { width: 90%; height: 80%; background: #fff; border: none; border-radius: 8px; }
    .close-btn { margin-bottom: 10px; background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Dual AI Arena</h2>
    <button class="btn-clear" onclick="clearChat()">Hapus Chat</button>
  </div>

  <div id="chat-box"></div>

  <div class="controls">
    <div id="preview-container">
      <img id="preview-img" src="" alt="Preview">
      <span>Gambar siap dikirim</span>
      <button style="padding: 2px 6px; background:#dc2626;" onclick="removeImage()">X</button>
    </div>

    <textarea id="user-input" placeholder="Ketik pesan atau unggah gambar..."></textarea>
    
    <div class="btn-group">
      <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
      <button class="btn-img" onclick="document.getElementById('image-input').click()">📷 Unggah Gambar</button>
      <button class="btn-gpt" onclick="sendPrompt('chatgpt')">Kirim ke ChatGPT</button>
      <button class="btn-game" onclick="renderGame()">🎮 Render Game</button>
      <button class="btn-gemini" onclick="sendPrompt('gemini')">Kirim ke Gemini</button>
      <button class="btn-both" onclick="sendPrompt('both')">Kirim ke Kedua AI</button>
    </div>
  </div>

  <div id="game-modal">
    <button class="close-btn" onclick="closeGame()">❌ Tutup Game</button>
    <iframe id="game-frame"></iframe>
  </div>

  <script>
    let lastCode = "";
    let selectedBase64Image = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('preview-img').src = selectedBase64Image;
        document.getElementById('preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      selectedBase64Image = null;
      document.getElementById('image-input').value = '';
      document.getElementById('preview-container').style.display = 'none';
    }

    async function sendPrompt(target) {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text && !selectedBase64Image) return;

      appendUserMsg(text, selectedBase64Image);

      const currentImage = selectedBase64Image;
      input.value = '';
      removeImage();

      if (target === 'chatgpt' || target === 'both') fetchAI('/api/chatgpt', text, currentImage, 'ai-chatgpt', 'CHATGPT');
      if (target === 'gemini' || target === 'both') fetchAI('/api/gemini', text, currentImage, 'ai-gemini', 'GOOGLE GEMINI');
    }

    async function fetchAI(url, message, image, cssClass, label) {
      const msgDiv = appendMsg('Memproses...', cssClass, label);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, image })
        });
        const data = await res.json();
        const reply = data.reply || data.error;
        msgDiv.innerText = `${label}\n\n${reply}`;

        const codeMatch = reply.match(/```html([\s\S]*?)```/) || reply.match(/```([\s\S]*?)```/);
        if (codeMatch) lastCode = codeMatch[1];
      } catch (err) {
        msgDiv.innerText = `${label}\n\nError: ${err.message}`;
      }
    }

    function appendUserMsg(text, imageBase64) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerText = `Kamu\n\n${text}`;
      if (imageBase64) {
        const img = document.createElement('img');
        img.src = imageBase64;
        div.appendChild(img);
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function appendMsg(text, cssClass, label) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${cssClass}`;
      div.innerText = label ? `${label}\n\n${text}` : text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    function renderGame() {
      if (!lastCode) {
        alert("Belum ada kode game HTML dari AI.");
        return;
      }
      const modal = document.getElementById('game-modal');
      const frame = document.getElementById('game-frame');
      frame.srcdoc = lastCode;
      modal.classList.add('active');
    }

    function closeGame() {
      document.getElementById('game-modal').classList.remove('active');
    }

    function clearChat() {
      document.getElementById('chat-box').innerHTML = '';
      lastCode = "";
      removeImage();
    }
  </script>
</body>
</html>
