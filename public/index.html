<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual AI Arena & Global Chat</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- SDK Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header class="app-header">
    <h1>⚔️ Dual AI Arena</h1>
  </header>

  <main class="main-container">
    <section id="game-container">
      <div id="ai-response-box" class="response-box">
        <p><em>Respons dari AI akan muncul di sini...</em></p>
      </div>
      
      <div class="input-control">
        <input type="text" id="prompt-input" placeholder="Ketik perintah untuk AI..." />
        <button onclick="sendAiPrompt()">Kirim ke AI</button>
      </div>
    </section>
  </main>

  <!-- Tombol Melayang Chat Global -->
  <button id="chat-toggle-btn" onclick="toggleChat()">💬 Chat Global</button>

  <!-- Box Chat Global -->
  <div id="global-chat-box" class="chat-box hidden">
    <div class="chat-header">
      <button id="name-btn" onclick="changeName()">👤 NAMA</button>
      <span>🌐 Chat Global</span>
      <button class="close-btn" onclick="toggleChat()">✖</button>
    </div>
    
    <div id="chat-messages" class="chat-messages">
      <div class="system-msg">Selamat datang di Obrolan Global!</div>
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Pesan pengguna..." onkeypress="handleChatEnter(event)" />
      <button onclick="sendChatMessage()">Kirim</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
